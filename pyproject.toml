[project]
name = "smarthome-mcp-home-assistant"
version = "0.2.0"
requires-python = ">=3.13.2,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pycares<5",
  "pytest-homeassistant-custom-component==0.13.272",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "D203", "D213", "PLR2004", "TC002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "PLR0913", "S101", "S105"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["custom_components/smarthome_mcp"]
